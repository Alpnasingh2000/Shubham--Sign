<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Signature - Shubham Sharma</title>

<link rel="stylesheet"

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f0f2f5;
    padding: 20px;
}

.signature-table {
    background: linear-gradient(135deg, #ffffff 0%, #f9fbf7 100%);
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    max-width: 850px;
    width: 100%;
    border-left: 10px solid #c5a059;
    border-collapse: collapse;
    margin: 0 auto;
    overflow: hidden;
}

.content-cell {
    padding: 30px;
}

.profile-photo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 4px solid #c5a059;
    object-fit: cover;
}

.name {
    font-size: 26px;
    font-weight: 800;
    color: #1a237e;
    margin: 0;
    text-transform: uppercase;
}

.designation {
    font-size: 16px;
    color: #c5a059;
    font-weight: 700;
    margin-top: 5px;
    text-transform: uppercase;
}

.subtitle {
    font-size: 14px;
    color: #616161;
    font-style: italic;
    margin-bottom: 15px;
}

.contact-item {
    font-size: 14px;
    color: #333;
    text-decoration: none;
    display: block;
    margin-bottom: 5px;
}

.contact-item i {
    color: #c5a059;
    width: 20px;
}

.address {
    font-size: 12px;
    color: #757575;
    line-height: 1.5;
    margin-top: 15px;
    border-top: 1px solid #eee;
    padding-top: 10px;
}

.social-links {
    margin-top: 12px;
}

.social-icon {
    font-size: 18px;
    color: #c5a059;
    text-decoration: none;
    margin-right: 12px;
}

.palace-logo {
    width: 110px;
    height: auto;
    display: block;
    margin-bottom: 15px;
}

.rtdc-logo {
    width: 60px;
    height: auto;
}

@media (max-width: 600px) {
    .signature-table td {
        display: block;
        width: 100% !important;
        text-align: center !important;
        padding: 10px !important;
    }

    .info-cell {
        border-right: none !important;
    }
}
</style>
</head>
